        const container = document.getElementById('questions-container');

        questions.forEach((q, index) => {
            const questionDiv = document.createElement('div');
            questionDiv.className = "bg-white p-6 rounded-lg shadow-md";
            
            let html = `<h3 class="text-lg font-bold mb-4 border-b pb-2">Questão ${q.number}</h3>`;
            html += `<p class="mb-4 text-gray-700 leading-relaxed overflow-x-auto">${q.text}</p>`;
            html += `<div class="space-y-3">`;
            
            q.options.forEach((opt, optIndex) => {
                html += `
                    <label id="label-q${index}-opt${optIndex}" class="flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition w-full">
                        <input type="radio" name="q${index}" value="${optIndex}" class="mr-3 w-5 h-5 text-indigo-600 border-gray-300 focus:ring-indigo-500 flex-shrink-0">
                        <span class="font-bold text-gray-500 mr-3">${letters[optIndex]})</span>
                        <span class="text-gray-800 flex-1 overflow-x-auto">${opt}</span>
                    </label>
                `;
            });
            
            html += `</div>`;
            questionDiv.innerHTML = html;
            container.appendChild(questionDiv);
        });

        document.getElementById('submit-btn').addEventListener('click', () => {
            let score = 0;
            
            questions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                
                // Limpar classes CSS se existirem
                for(let i = 0; i < 5; i++) {
                    document.getElementById(`label-q${index}-opt${i}`).classList.remove('correct-answer', 'wrong-answer', 'missed-correct');
                }
                
                // Tratar gabarito
                const correctLabel = document.getElementById(`label-q${index}-opt${q.answer}`);
                
                if (selected) {
                    const selectedVal = parseInt(selected.value);
                    const selectedLabel = document.getElementById(`label-q${index}-opt${selectedVal}`);
                    
                    if (selectedVal === q.answer) {
                        score++;
                        selectedLabel.classList.add('correct-answer');
                    } else {
                        selectedLabel.classList.add('wrong-answer');
                        correctLabel.classList.add('missed-correct');
                    }
                } else {
                    correctLabel.classList.add('missed-correct');
                }
                
                // Desabilitar todas as opções após correção
                document.querySelectorAll(`input[name="q${index}"]`).forEach(input => input.disabled = true);
            });
            
            // Exibir pontuação final
            document.getElementById('score').innerText = score;
            document.getElementById('result-display').classList.remove('hidden');
            
            // Alterar botão
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.classList.replace('bg-indigo-600', 'bg-gray-400');
            btn.classList.replace('hover:bg-indigo-700', 'hover:bg-gray-400');
            btn.classList.add('cursor-not-allowed');
            btn.innerText = "Respostas Verificadas";
            
            // Reprocessar equações MathJax se necessário para ajustar backgrounds
            MathJax.typesetPromise();
            
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        });
